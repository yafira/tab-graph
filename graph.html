<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tab graph</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="graph.css">
</head>
<body>
<header class="bar">
  <h1>tab graph</h1>
  <span class="counts" id="counts"></span>
  <span class="spacer"></span>
  <div class="toggle" role="group" aria-label="view">
    <button id="view-graph" aria-pressed="true">graph</button>
    <button id="view-list" aria-pressed="false">list</button>
  </div>
  <input id="q" type="search" placeholder="find a tab" aria-label="find a tab">
</header>
<main>
  <canvas id="canvas" role="img" aria-label="your open tabs drawn as a graph, grouped by site"></canvas>
  <div class="legend" id="legend">
    <span><i class="dot big"></i>a website you have 2 or more tabs open on</span>
    <span><i class="dot"></i>tab</span>
    <span><i class="key pink"></i>opened from another tab</span>
    <span class="hint">click a tab to go to it · right-click for more · delete closes the tab under the pointer</span>
  </div>
  <div class="list" id="list" hidden></div>
  <div class="peek" id="peek" hidden>
    <b></b>
    <span></span>
  </div>
  <div class="menu" id="menu" role="menu" hidden></div>
  <p class="empty" id="empty" hidden>no other tabs are open.</p>
</main>
<script src="graph.js"></script>
</body>
</html>
